name: "Metis - Partidas do Olimpo (A cada 2 dias)"

on:
  schedule:
    # Roda às 19:00 BRT (22:00 UTC) a cada 2 dias — termina ~21:00 UTC
    - cron: '0 22 */2 * *'
  workflow_dispatch:

jobs:
  ingest-pro-matches:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: pip install requests boto3 python-dotenv riotwatcher

      - name: Executar Script
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python -m scripts.ingestion.fetch_pro_matches
