name: "Metis - Limpeza Bronze → Prata (Partidas)"

on:
  schedule:
    # Roda todo dia às 14:00 UTC — após o ingest high-elo terminar (~08:00 + ~5h40m)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  process-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install boto3 python-dotenv supabase polars

      - name: Rodar pipeline Bronze → Prata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
          BATCH_SIZE: "50"
        run: python -m scripts.processing.process_matches
