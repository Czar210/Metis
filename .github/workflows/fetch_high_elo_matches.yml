name: "Metis - Ingestão High Elo (Diária)"

on:
  schedule:
    # Roda todo dia às 03:00 UTC (meia noite BRT) — termina ~08:40 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar apertando o botão manualmente no GitHub

jobs:
  ingest-high-elo:
    runs-on: ubuntu-latest
    timeout-minutes: 280  # ~4h40m — 400 players cabem com folga (428 players ≈ 5h com 500)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests boto3 python-dotenv riotwatcher

      - name: Executar Trator de Ingestão
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_PLAYERS_PER_TIER: "200"  # 200 players ≈ 2h30m — dentro do timeout de 280min
        run: python -m scripts.ingestion.fetch_high_elo_matches
