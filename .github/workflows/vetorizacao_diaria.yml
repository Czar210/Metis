name: "Metis — Vetorização Ouro (Guias)"

on:
  schedule:
    # Segunda-feira 12:00 UTC — 8h após o scraping do Mobafire (04:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install boto3 python-dotenv supabase google-genai

      - name: Rodar vetorização Bronze → Ouro
        env:
          PYTHONPATH: ${{ github.workspace }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python -m scripts.ouro.vectorize_guides
