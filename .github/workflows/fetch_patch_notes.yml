name: Patch Notes (LoL Wiki)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Toda segunda as 06:00 UTC (apos scraping, antes da vetorizacao)

jobs:
  fetch-patch-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4 boto3 python-dotenv google-genai supabase==2.28.0

      - name: Instalar Navegador (Playwright)
        run: |
          playwright install chromium
          playwright install-deps

      - name: Scraper de Patch Notes
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLOUDFLARE_R2_ACCOUNT_ID:       ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID:    ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
        run: python -m scripts.ingestion.fetch_patch_notes

      - name: Vetorizar Patch Notes
        env:
          PYTHONPATH: ${{ github.workspace }}
          CLOUDFLARE_R2_ACCOUNT_ID:       ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID:    ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_KEY:   ${{ secrets.GEMINI_KEY }}
        run: python -m scripts.ouro.vectorize_patch_notes
