name: 📚 Ingestão de Guias (Mobafire)

on:
  workflow_dispatch: # Permite rodar clicando no botão "Run workflow"
  schedule:
    - cron: '0 4 */3 * *' # Roda às 04:00 UTC a cada 3 dias

jobs:
  scrape-wisdom:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 4h — 172 campeões × 2 guias (~50s/guia estimado)

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 boto3 python-dotenv

      - name: 🌐 Instalar Navegador (Playwright)
        run: |
          playwright install chromium
          playwright install-deps

      - name: 💾 Restaurar cache de URLs visitadas
        uses: actions/cache@v4
        with:
          path: data/raw/guides_preview/_visited_urls.json
          # Chave muda a cada run para sempre salvar a versão mais nova
          key: visited-urls-${{ github.run_id }}
          restore-keys: |
            visited-urls-

      - name: 🗂️ Gerar champion.json (Data Dragon)
        run: |
          mkdir -p data/static
          python -c "
          import requests, json
          ver = requests.get('https://ddragon.leagueoflegends.com/api/versions.json').json()[0]
          data = requests.get(f'https://ddragon.leagueoflegends.com/cdn/{ver}/data/pt_BR/champion.json').json()
          with open('data/static/champion.json', 'w', encoding='utf-8') as f:
              json.dump(data, f)
          print(f'champion.json gerado: patch {ver}, {len(data[\"data\"])} campeões')
          "

      - name: 🚀 Executar Infiltrador do Mobafire (todos os 172 campeões)
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: "metis"
        run: |
          python -m scripts.ingestion.fetch_guides --auto --headless --guides 2
